name: Dependency Check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1' # Weekly Monday 9am

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  outdated:
    name: Check Outdated Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check outdated (npm)
        run: npm outdated || true

      - name: Check outdated (npm-check-updates)
        run: npx npm-check-updates || true

      - name: Summary
        run: |
          echo "## Dependency Status" >> $GITHUB_STEP_SUMMARY
          echo "Run \`npm outdated\` and \`npx npm-check-updates\` locally for details." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Automated PRs:** Dependabot runs weekly (see .github/dependabot.yml)" >> $GITHUB_STEP_SUMMARY
