name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

# Cancel in-progress runs when a new commit is pushed to the same branch or PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Node.js CI (Node 24)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm' # Native npm dependency caching

      - name: Install dependencies
        run: npm ci

      - name: Build UMD
        run: npm run build:umd

      - name: Compatibility Test (non-PR runs only)
        if: github.event_name != 'pull_request'
        run: npm run test:compat

      - name: Run test suite
        run: npm run test