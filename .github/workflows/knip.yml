name: Knip

on:
  pull_request:
    branches:
      - '**'
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'knip.json'
      - 'src/**'
      - 'plugins/**'
      - 'tests/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  knip:
    name: Knip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run knip
        run: npx knip
