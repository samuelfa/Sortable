name: Security Audit

on:
  pull_request:
    branches:
      - '**'
    paths:
      - 'package.json'
      - 'package-lock.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit-report.json
          retention-days: 7

      - name: Audit summary
        if: always()
        run: |
          echo "## Security Audit Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f npm-audit-report.json ]; then
            VULN_COUNT=$(cat npm-audit-report.json | jq '.metadata.vulnerabilities.total // 0')
            CRITICAL=$(cat npm-audit-report.json | jq '.metadata.vulnerabilities.critical // 0')
            HIGH=$(cat npm-audit-report.json | jq '.metadata.vulnerabilities.high // 0')
            MODERATE=$(cat npm-audit-report.json | jq '.metadata.vulnerabilities.moderate // 0')
            LOW=$(cat npm-audit-report.json | jq '.metadata.vulnerabilities.low // 0')
            echo "- **Total vulnerabilities:** $VULN_COUNT" >> $GITHUB_STEP_SUMMARY
            echo "- **Critical:** $CRITICAL" >> $GITHUB_STEP_SUMMARY
            echo "- **High:** $HIGH" >> $GITHUB_STEP_SUMMARY
            echo "- **Moderate:** $MODERATE" >> $GITHUB_STEP_SUMMARY
            echo "- **Low:** $LOW" >> $GITHUB_STEP_SUMMARY
            if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
              echo "⚠️ **Critical/High vulnerabilities found!**" >> $GITHUB_STEP_SUMMARY
            fi
          fi