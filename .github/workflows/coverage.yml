name: Code Coverage

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run coverage test
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Coverage summary
        run: |
          if [ -f coverage/coverage.json ]; then
            echo "## Code Coverage Summary" >> $GITHUB_STEP_SUMMARY
            cat coverage/coverage.json | jq -r '
              "Statements: \(.statements.pct)% (\(.statements.covered)/\(.statements.total))",
              "Branches: \(.branches.pct)% (\(.branches.covered)/\(.branches.total))",
              "Functions: \(.functions.pct)% (\(.functions.covered)/\(.functions.total))",
              "Lines: \(.lines.pct)% (\(.lines.covered)/\(.lines.total))"
            ' >> $GITHUB_STEP_SUMMARY
          fi
