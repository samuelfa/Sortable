name: Code Coverage

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run coverage test
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/coverage.json
          fail_ci_if_error: false
          verbose: true

      - name: Coverage summary
        run: |
          if [ -f coverage/coverage.json ]; then
            echo "## Code Coverage Summary" >> $GITHUB_STEP_SUMMARY
            cat coverage/coverage.json | jq -r '
              "Statements: \(.statements.pct)% (\(.statements.covered)/\(.statements.total))",
              "Branches: \(.branches.pct)% (\(.branches.covered)/\(.branches.total))",
              "Functions: \(.functions.pct)% (\(.functions.covered)/\(.functions.total))",
              "Lines: \(.lines.pct)% (\(.lines.covered)/\(.lines.total))"
            ' >> $GITHUB_STEP_SUMMARY
          fi
