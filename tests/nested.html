<!DOCTYPE html>
<html>
<head>
	<title></title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" type="text/css" href="./style.css">
</head>
<body>

<div id="list1" class="list">
	<div>Item 1.1
		<div class="list n1">
			<div>Item 2.1</div>
			<div>Item 2.2
				<div class="list n2">
					<div>Item 3.1</div>
					<div>Item 3.2</div>
					<div>Item 3.3</div>
					<div>Item 3.4</div>
				</div>
			</div>
			<div>Item 2.3</div>
			<div>Item 2.4</div>
		</div>
	</div>
	<div>Item 1.2</div>
	<div>Item 1.3</div>
	<div>Item 1.4
		<div class="list n1">
			<div>Item 2.1</div>
			<div>Item 2.2</div>
			<div>Item 2.3</div>
			<div>Item 2.4</div>
		</div>
	</div>
	<div>Item 1.5</div>
</div>

<style>
	/* Items containing nested lists must grow with their content
	   (tests/style.css forces a fixed height that would otherwise overlap siblings) */
	.list > div:has(> .list) {
		height: auto;
	}

	.n1 > div {
		background-color: lightblue;
	}

	.n2 > div {
		background-color: lightgreen
	}

	.list {
		padding: 20px;
	}

</style>

<script src="../dist/Sortable.iife.js"></script>

<script type="text/javascript">
	function testSortableOptions() {
		return window.__sortableTestOptions || {};
	}

	var elements = document.getElementsByClassName('list');
	var options = Object.assign({ group: 'shared', invertSwap: true }, testSortableOptions());

	for (var i = 0; i < elements.length; i++) {
		new Sortable(elements[i], options);
	}
</script>

</body>
</html>
